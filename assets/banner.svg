<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Trinath Pittala, full-stack software engineer</title>
  <desc id="d">Five coloured tiles: name and tagline; now a Systems Developer at Clemson University; two games on the App Store and Google Play; three papers in machine learning; M.S. Computer Science.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; opacity: 0.8; }
    .name { font-size: 96px; font-weight: 800; letter-spacing: -3.5px; }
    .big { font-size: 118px; font-weight: 800; letter-spacing: -4px; }
    .head { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    .body { font-size: 22px; font-weight: 500; }
    /* Tiles settle into place one after another, as they do on trinathpittala.com.
       Only the size animates, so the banner is complete even where animation does not run. */
    .tile { transform-box: fill-box; transform-origin: center; animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
    @keyframes pop { from { transform: scale(0.82); } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; } }
  </style>

  <g class="tile" fill="#ffffff">
    <rect width="710" height="400" rx="28" fill="#2b44ff"/>
    <text class="label" x="44" y="66">FULL-STACK SOFTWARE ENGINEER</text>
    <text class="name" x="40" y="172">Trinath</text>
    <text class="name" x="40" y="264">Pittala</text>
    <text class="body" x="44" y="324">I build backend services and web applications that</text>
    <text class="body" x="44" y="354">hold up in production. Making games is my hobby.</text>
  </g>

  <g class="tile" fill="#172000" style="animation-delay: 0.08s">
    <rect x="720" width="480" height="126" rx="28" fill="#c6f135"/>
    <text class="label" x="748" y="42">NOW</text>
    <text class="head" x="748" y="80">Systems Developer</text>
    <text class="body" x="748" y="108">Clemson University</text>
  </g>

  <g class="tile" fill="#200700" style="animation-delay: 0.16s">
    <rect x="720" y="136" width="235" height="264" rx="28" fill="#ff5630"/>
    <text class="big" x="744" y="254">2</text>
    <text class="body" x="748" y="302">games on the</text>
    <text class="body" x="748" y="330">App Store and</text>
    <text class="body" x="748" y="358">Google Play</text>
  </g>

  <g class="tile" fill="#150b33" style="animation-delay: 0.24s">
    <rect x="965" y="136" width="235" height="127" rx="28" fill="#b9a3ff"/>
    <text class="label" x="993" y="178">RESEARCH</text>
    <text class="head" x="993" y="216">3 papers</text>
    <text class="body" x="993" y="242" style="font-size: 19px">in machine learning</text>
  </g>

  <g class="tile" fill="#02241d" style="animation-delay: 0.32s">
    <rect x="965" y="273" width="235" height="127" rx="28" fill="#19c9a8"/>
    <text class="label" x="993" y="315">EDUCATION</text>
    <text class="head" x="993" y="353" style="font-size: 23px">M.S. Computer</text>
    <text class="head" x="993" y="381" style="font-size: 23px">Science</text>
  </g>
</svg>
